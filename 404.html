<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#051920" />
  <title>الصفحة غير موجودة — معرض ترسيخ القيم</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #051920 radial-gradient(1100px 600px at 50% -14%, rgba(0, 130, 148, 0.27), transparent 64%);
      color: #eee9de;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'SF Pro Arabic', sans-serif;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    p { margin: 0 0 1.5rem; color: #a0b6b9; }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: linear-gradient(150deg, #0f919c 0%, #006a7d 100%);
      color: #fbfaf6;
      font-weight: 800;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 14px 34px rgba(0, 106, 125, 0.32);
    }
  </style>
</head>
<body>
  <main>
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط الذي فتحته غير موجود في معرض ترسيخ القيم.</p>
    <a id="home" href="/">العودة إلى المعرض</a>
  </main>
  <!-- The site sits at the root of the Cloudflare and Firebase links and under
       /al-ilm-values-expo/ on GitHub Pages. "./" pointed at the wrong folder
       when the bad link had more than one part (/a/b led to /a/, another
       «غير موجودة»), so the button goes to the site's own start (v5.13.8). -->
  <script>
    (function () {
      var gh = '/al-ilm-values-expo/';
      if (location.pathname.indexOf(gh) === 0) document.getElementById('home').href = gh;
    })();
  </script>
</body>
</html>
